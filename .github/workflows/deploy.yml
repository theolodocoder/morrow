# Deploys to the single production server (docs/DEPLOY.md): SSH in, check out the chosen ref, rebuild and restart with
# Docker Compose, then check the public site from outside. Manual only. Never runs on pull requests.
#
# Repository secrets: DEPLOY_HOST, DEPLOY_USER, DEPLOY_SSH_KEY (a deploy-only private key),
#   DEPLOY_KNOWN_HOSTS (the output of `ssh-keyscan -t ed25519 <host>`, checked once by hand).
# Repository variables: MORROW_DOMAIN (e.g. morrow.example.org), DEPLOY_PATH (optional, default: morrow in the
#   user's home).
name: deploy
on:
  workflow_dispatch:
    inputs:
      ref:
        description: Branch, tag or commit to deploy
        required: true
        default: main
  # To deploy on every push to a release branch, uncomment:
  # push:
  #   branches: [release]

permissions:
  contents: read

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: production
    env:
      REF: ${{ inputs.ref || github.ref_name }}
      DEPLOY_PATH: ${{ vars.DEPLOY_PATH || 'morrow' }}
      MORROW_DOMAIN: ${{ vars.MORROW_DOMAIN }}
    steps:
      - name: Check inputs
        run: |
          # The ref and path end up in a remote shell command: allow only plain names, never an option ("-...").
          [[ "$REF" =~ ^[A-Za-z0-9._/][A-Za-z0-9._/-]*$ ]] || { echo "bad ref: $REF"; exit 1; }
          [[ "$DEPLOY_PATH" =~ ^[A-Za-z0-9._/][A-Za-z0-9._/-]*$ ]] || { echo "bad DEPLOY_PATH"; exit 1; }
          [[ -n "$MORROW_DOMAIN" ]] || { echo "set the MORROW_DOMAIN repository variable"; exit 1; }

      - name: SSH key
        env:
          KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$KEY" > ~/.ssh/deploy_key && chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts

      - name: Deploy
        env:
          HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
        run: |
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=yes -o ServerAliveInterval=30 "$DEPLOY_USER@$HOST" \
            "set -euo pipefail
             cd '$DEPLOY_PATH'
             git fetch --prune origin '$REF'
             git checkout --force --detach FETCH_HEAD
             git log -1 --format='deploying %h %s'
             # A fresh dump before migrations run. Skipped on the very first deploy (no database yet) and while the
             # template's R2 placeholders are in place; once backups are configured, a failed dump stops the deploy.
             if [ -n \"\$(docker compose --env-file .env.production -f docker-compose.prod.yml ps -q --status running postgres)\" ]; then
               deploy/backup.sh --if-configured
             else
               echo 'no pre-deploy dump: postgres is not running yet'
             fi
             docker compose --env-file .env.production -f docker-compose.prod.yml up -d --build --remove-orphans --wait --wait-timeout 600
             docker image prune -f
             docker builder prune -f --filter until=168h"

      - name: Smoke check through Caddy
        run: |
          check() {
            for i in $(seq 1 12); do
              curl -fsS -o /dev/null --max-time 10 "$1" && { echo "ok  $1"; return 0; }
              sleep 5
            done
            echo "FAILED $1"; return 1
          }
          check "https://$MORROW_DOMAIN/"
          check "https://$MORROW_DOMAIN/api/auth/ok"           # web → api
          check "https://collab.$MORROW_DOMAIN/healthz"         # collab

      - name: Remove key
        if: always()
        run: rm -f ~/.ssh/deploy_key
