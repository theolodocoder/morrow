name: ci
on: [push, pull_request]
jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env: { POSTGRES_USER: morrow, POSTGRES_PASSWORD: morrow, POSTGRES_DB: morrow }
        ports: ['5432:5432']
        options: --health-cmd "pg_isready -U morrow" --health-interval 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-node@v4
        with: { node-version-file: .nvmrc }
      - run: corepack enable && pnpm install --frozen-lockfile
      - run: pnpm --filter @morrow/tokens build
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm test
        env: { TEST_DATABASE_URL: 'postgres://morrow:morrow@127.0.0.1:5432/morrow' }
      # The whole history, every time. (The gitleaks action scans only the pushed range, and fails on a new
      # repository's first push, where that range starts before the first commit.)
      - name: Secret scan
        run: |
          curl -sSfL https://github.com/gitleaks/gitleaks/releases/download/v8.24.3/gitleaks_8.24.3_linux_x64.tar.gz \
            | tar xz -C /tmp gitleaks
          /tmp/gitleaks git --redact --verbose --exit-code 1 .
